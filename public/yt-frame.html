<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 영상 테스트 D용: viewport-fit=cover 없이 유튜브를 한 번 더 감싸는 액자 페이지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영상 액자</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      const id = new URLSearchParams(location.search).get('v') || ''
      const f = document.createElement('iframe')
      f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?playsinline=1&rel=0'
      f.allow = 'autoplay; encrypted-media; picture-in-picture'
      document.body.appendChild(f)
    </script>
  </body>
</html>
