<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover는 쓰지 않음: 켜면 아이폰 가로 화면에서 카메라(다이나믹 아일랜드) 여백 정보가
         유튜브 플레이어 안까지 전달돼 영상이 옆으로 밀려 잘림 (CSS로 보정 불가, 실험으로 확인).
         대신 화면 높이는 src/main.jsx에서 직접 재서 --app-h로 씀 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그림책 읽기 도우미</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- 아이폰/아이패드 홈 화면용 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="그림책" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FFD84D" />
    <!-- 글꼴: Andika(아이들이 글자 배우기 쉽게 만든 영어 글꼴), Jua(둥근 한글 글꼴) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
