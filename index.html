<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 화면 배치(아이폰 홈 바·카메라 자리)를 앱이 직접 맞추기 위해 필요.
         주의: 이걸 켜면 카메라 여백 정보가 유튜브 플레이어 안에도 전달돼 영상이 옆으로 밀림
         → Reader.css의 .yt-box iframe에서 보정함 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>그림책 읽기 도우미</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- 아이폰/아이패드 홈 화면용 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="그림책" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FFD84D" />
    <!-- 글꼴: Andika(아이들이 글자 배우기 쉽게 만든 영어 글꼴), Jua(둥근 한글 글꼴) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
